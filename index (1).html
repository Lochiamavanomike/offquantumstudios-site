<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Off Quantum Studios</title>
  <meta name="description" content="Off Quantum Studios — games, apps and digital products.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #10172a;
      --card: #182238;
      --text: #f4f7fb;
      --muted: #b8c2d6;
      --line: #2b3957;
      --accent: #8fc8ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px;
    }
    h1 { margin: 0 0 10px; font-size: clamp(2rem, 7vw, 4rem); line-height: 1; }
    p { line-height: 1.7; color: var(--muted); }
    a { color: var(--accent); }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .links a {
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
    }
    footer { margin-top: 32px; font-size: .92rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Off Quantum Studios</h1>
    <p>Games, apps and digital products.</p>
    <p><strong>Cat Logistics</strong> is currently being prepared for release on Android.</p>

    <div class="links">
      <a href="https://privacy.offquantumstudios.com/">Privacy Policy</a>
      <a href="mailto:support@offquantumstudios.com">Support</a>
    </div>

    <footer>© 2026 Off Quantum Studios</footer>
  </main>
</body>
</html>
